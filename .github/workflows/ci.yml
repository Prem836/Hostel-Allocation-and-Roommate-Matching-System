name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Check Server Type Definitions
        run: npm --workspace=server run lint

      - name: Build Server
        run: npm --workspace=server run build

      - name: Run Server Unit & Integration Tests
        run: npm --workspace=server test
        env:
          JWT_SECRET: ci-test-secret-min-32-chars-long-1234
          DATA_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          MONGODB_URI: mongodb://localhost:27017/hostel_test
          REDIS_HOST: localhost
          REDIS_PORT: 6379
